# Nginx Configuration for SMS API Proxy
# این config رو به nginx frontend اضافه کن

# در فایل nginx config (معمولاً /etc/nginx/sites-available/default)
# یا در docker-compose nginx service

server {
    listen 80;
    server_name panel.mehrsun.gold;  # یا domain شما

    # Frontend (Next.js)
    location / {
        proxy_pass http://localhost:3000;  # یا port frontend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SMS API Proxy - این قسمت رو اضافه کن
    location /sms-api/ {
        # اگه backend و frontend روی یک سرور هستن:
        proxy_pass http://localhost:3005/;
        
        # اگه در containerهای جدا هستن:
        # proxy_pass http://backend-container:3005/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        
        # CORS headers (اگه نیاز بود)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }
}
